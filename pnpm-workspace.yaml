packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

ignoredBuiltDependencies:
  - sharp

minimumReleaseAge: 5760

# @vercel/otel's SDK packages peer-require @opentelemetry/api <1.10.0,
# but better-auth pulls 1.10.0 in transitively. Hold the API at 1.9.x
# until the OpenTelemetry SDK widens its range (exact pin: ^1.9.1 still floats to 1.10.0).
overrides:
  "@opentelemetry/api": "1.9.1"
  # fumadocs-core 16.9.3's markdown stringifier recurses infinitely against
  # mdast-util-to-markdown 2.2.0. Remove together with the deferred fumadocs
  # upgrade (see apps/docs).
  mdast-util-to-markdown: "2.1.2"

onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - "@vercel/speed-insights"
  - esbuild
  - prisma
  - unrs-resolver
